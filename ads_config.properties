# ============================================================================
#  TurboTouch — configuracao de anuncios
# ============================================================================
#  Este arquivo e lido no build (Gradle) e embarcado em app/src/main/assets/
#  como ads_config.properties. Troque os valores abaixo pelos seus IDs reais
#  de zona e reconstrua o app. Nada aqui e obrigatorio: com ads.enabled=false
#  o modulo de anuncios nao inicializa nada.
#
#  Rede padrao: smartlink (Adsterra / Monetag / PropellerAds "Direct Link").
#  Essas redes sao self-serve, nao exigem o app em loja de aplicativos e
#  nao passam por aprovacao de SDK. Leia docs/ADS.md.
# ============================================================================

# Liga/desliga o modulo de anuncios do app.
ads.enabled=true

# smartlink | admob | reflective | none
ads.provider=smartlink

# --- smartlink -------------------------------------------------------------
# URL de destino (Adsterra Smartlink, Monetag Direct Link, PropellerAds Direct Link).
ads.smartlink.url=https://smart.adsterra.com/smartlink/SEU_ZONE_ID

# --- admob -----------------------------------------------------------------
# O app id do AdMob vem do build (manifestPlaceholders). O bloco abaixo e o
# que voce pode trocar em tempo de execucao pela tela "Ads".
ads.admob.app_id=ca-app-pub-3940256099942544~3347511713
ads.admob.banner_unit=ca-app-pub-3940256099942544/6300978111
ads.admob.interstitial_unit=ca-app-pub-3940256099942544/1033173712

# --- background slot -------------------------------------------------------
# Segundos entre exibicoes do slot de fundo (popunder/ interstitial ao voltar
# para o app). 0 desliga.
ads.background.interval_sec=45

# Logs verbosos do modulo de anuncios.
ads.debug=true

# --- reflective ------------------------------------------------------------
# Binder generico: liga qualquer SDK de anuncios por nome de classe, sem
# dependencia de compilacao. Use quando voce adiciona o AAR/dependencia do
# seu SDK no build.gradle.kts.
ads.reflective.init_class=
ads.reflective.init_method=initialize
ads.reflective.banner_class=
ads.reflective.interstitial_class=
